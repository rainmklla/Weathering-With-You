<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="center-wrapper">
        <div class="board-container">
            <img src="bigboard.png" alt="Board" class="bigboard-img">

            <div class="board-content">
                <h1>LOGIN</h1>

                <form>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <p class="signup-link">
                        Don’t have an account? 
                        <a href="signup.html">Sign up</a> 
                    </p>

                    <div class="forward-btn-wrapper">
                        <img src="forward.png" alt="Login" class="forward-btn" id="login-forward">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // When clicking the forward button, show loading screen first
        document.getElementById("login-forward").addEventListener("click", (e) => {
            e.preventDefault();
            // Redirect to loading.html first with target destination as parameter
            window.location.href = "loading.html?redirect=" + encodeURIComponent("index.html");
        });
    </script>
</body>
</html>
